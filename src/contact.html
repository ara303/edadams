---
layout: base.njk
scripts:
  - /js/contact.js
---
    <section class="section section-contact" id="contact">
      <form class="form-contact" id="form-contact" name="contact" method="POST" action="/api/contact" novalidate>
        <div class="form-section form-section-name">
          <label class="form-label" for="contact-name">Your name</label>
          <input class="form-input" type="text" name="name" id="contact-name" required autocomplete="name" maxlength="100" />
        </div>
        <div class="form-section form-section-info">
          <label class="form-label" for="contact-info">Email or phone number</label>
          <input class="form-input" type="text" name="info" id="contact-info" required autocomplete="email" maxlength="200" />
          <p class="form-info-help">Let me know how you prefer to be contacted.</p>
        </div>
        <div class="form-section form-section-message">
          <label class="form-label" for="contact-message">How can I help you?</label>
          <textarea class="form-input form-textarea" name="message" id="contact-message" maxlength="5000"></textarea>
        </div>

        <div class="form-section form-section-turnstile">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAExkMyNYlYrP9EC2" data-action="contact" data-theme="light"></div>
        </div>

        <div class="form-section form-section-submit">
          <button class="form-submit" type="submit">Send message</button>
        </div>
        <div class="form-section form-section-messages">
          <div class="form-success" id="form-success" role="status" aria-live="polite"></div>
          <div class="form-failure" id="form-failure" role="alert" aria-live="assertive"></div>
        </div>
        <div class="form-section form-section-disclaimer">
          <div class="form-disclaimer">
            <p class="big">Regarding privacy&hellip;</p>
            <p>Your information is processed only so it can be emailed so I can reply via email or phone. Only the information you provide is kept. Nothing else is stored.</p>
          </div>
        </div>
      </form>
    </section>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>
